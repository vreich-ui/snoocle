[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snoocle-server"
version = "0.1.0"
description = "Audio-to-song-data foundry: web-sourced chord/lyric text + MIR analysis, reconciled by a configurable LLM into Snoocle Song JSON."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # [default] pulls in yt-dlp-ejs (YouTube JS challenge-solver scripts) and
    # the other upstream-recommended deps. Since 2025.11.12 YouTube needs those
    # scripts PLUS an external JS runtime (deno, installed in the Dockerfile);
    # without them most formats are withheld and downloads fail with
    # "Requested format is not available".
    "yt-dlp[default]>=2025.11.12",
    # 1.10.0 is the first release with the streamable-HTTP transport AND the
    # transport_security (DNS-rebinding) settings the HTTP MCP server uses.
    # Ceiling is load-bearing: mcp 2.0.0 REMOVED `mcp.server.fastmcp`, which
    # `mcp_server.py` imports at module scope. Because this was unpinned, a
    # routine rebuild resolved to 2.0.0 and every Cloud Run instance died at
    # import with ModuleNotFoundError before it could bind $PORT — a deploy
    # failure with no code change behind it. 1.29.0 (latest 1.x) still ships
    # the module. Raising this ceiling means porting to the 2.x server API.
    "mcp>=1.10.0,<2",
    # Durable song store (Firestore Native). Uses Application Default
    # Credentials; the project comes from GOOGLE_CLOUD_PROJECT.
    "google-cloud-firestore>=2.11",
    # In-process agentic reconciler (provider "anthropic-agent"): the Anthropic
    # Python SDK. The Docker image already installs it; declared here so dev
    # installs pick it up too. Imported lazily inside the provider, like the
    # other providers do with their deps.
    "anthropic>=0.66",
    # Deterministic chord-sheet prefetch accepts PDF sources. Text extraction
    # is local and never delegates document contents to the model.
    "pypdf>=5.0",
]

[project.optional-dependencies]
mir = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
]
# Runtime deps of the vendored Chord-CNN-LSTM checkout (scripts/
# setup_chord_model.sh). torch is intentionally NOT pinned to a CPU build
# here — pass --index-url https://download.pytorch.org/whl/cpu at install
# time (as the Dockerfile does) to avoid the multi-GB CUDA wheel.
chordmodel = [
    "torch>=2.0",
    "h5py>=3.0",
    "pretty_midi>=0.2.9",
    "mir_eval>=0.7",
    "pydub>=0.23",
]
# Stem separation (B4). Pulls torch — install with
#   --index-url https://download.pytorch.org/whl/cpu
# unless you actually have CUDA, or pip fetches a multi-GB CUDA wheel. This is
# a WORKER extra: the Cloud Run image deliberately does not carry it.
stems = [
    "demucs>=4.0",
    "torch>=2.0",
    "torchaudio>=2.0",
]
# Forced alignment (B2). Same story as stems — worker-side, torch-backed.
align = [
    "whisperx>=3.1",
    "torch>=2.0",
]
# Music theory for the quality grader's key-explainability metric
# (snoocle_server/quality/theory.py): does the established key explain every
# stored chord? music21 owns the key -> scale and chord-symbol -> pitch-class
# mappings; reimplementing either would be both worse and untrustworthy.
#
# An EXTRA rather than a core dep because it pulls matplotlib/numpy/pillow for
# features this server never touches, and because the grader degrades the way
# every other optional engine here does: without it the metric reports "not
# measured" with the reason, and no other metric or decision changes.
theory = ["music21>=9.1"]
dev = ["pytest>=8", "music21>=9.1"]

[project.scripts]
snoocle-server = "snoocle_server.api:main"
snoocle-mcp = "snoocle_server.mcp_server:main"
snoocle-worker = "snoocle_server.worker:main"

[tool.setuptools.packages.find]
include = ["snoocle_server*"]

# Ship the static GUI files in the wheel — the Docker image runs the installed
# package, not the source tree, so the ui/ assets must be package data.
#
# The `**` matters: a plain `ui/*` does NOT cross directory separators, so it
# silently ships the admin and drops the whole player (ui/play/, its icons, and
# ui/vendor/) — a deploy that 404s /ui/play/ while every test passes against the
# source tree. tests/test_packaging.py fails the build if a ui/ file stops being
# matched.
[tool.setuptools.package-data]
snoocle_server = ["ui/**/*", "studio/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
