name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,mir]"
      # test_mcp_tools_over_stdio spawns the server as a subprocess and fails to
      # decode its first stdout frame outside a real terminal. Deselected so a
      # known-environmental failure cannot mask a real one; fix it and drop this.
      - run: pytest -q --deselect tests/test_mcp_server.py::test_mcp_tools_over_stdio

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the Dockerfile's studio-builder stage, or a fresh build
          # here can hash differently from the one that ships.
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
      # The compiled bundle is committed and ships in the wheel, so it can go
      # stale while every test still passes - the failure mode where the code is
      # right and the page is still wrong.
      - name: Committed bundle matches source
        run: |
          if ! git diff --quiet -- snoocle_server/studio || [ -n "$(git status --porcelain -- snoocle_server/studio)" ]; then
            echo "::error::snoocle_server/studio is stale. Run 'cd studio && npm run build' and commit the result."
            git status --porcelain -- snoocle_server/studio
            exit 1
          fi
